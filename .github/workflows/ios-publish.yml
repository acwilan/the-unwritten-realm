name: Publish iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion (defaults to the workflow run number)"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ios-testflight-publish
  cancel-in-progress: false

env:
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  PROJECT: TheUnwrittenRealm.xcodeproj
  SCHEME: TheUnwrittenRealm
  BUNDLE_ID: com.acwilan.TheUnwrittenRealm
  TEAM_ID: LT3ZSC5BDA
  PROVISIONING_PROFILE_NAME: AppStore com.acwilan.TheUnwrittenRealm

jobs:
  publish:
    name: Archive and upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Import distribution certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Archive and export IPA
        id: archive
        uses: Apple-Actions/xcodebuild@v1
        with:
          project: ${{ env.PROJECT }}
          scheme: ${{ env.SCHEME }}
          configuration: Release
          sdk: iphoneos
          destination: generic/platform=iOS
          action: archive
          archive-path: ${{ runner.temp }}/TheUnwrittenRealm.xcarchive
          export-options-plist: ExportOptions.plist
          export-path: ${{ runner.temp }}/TheUnwrittenRealm.ipa
          build-number: ${{ inputs.build_number || github.run_number }}
          build-settings: |
            CODE_SIGN_STYLE=Manual
            CODE_SIGN_IDENTITY=Apple Distribution
            DEVELOPMENT_TEAM=${{ env.TEAM_ID }}
            PROVISIONING_PROFILE_SPECIFIER=${{ env.PROVISIONING_PROFILE_NAME }}

      - name: Upload build to TestFlight
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.archive.outputs.ipa-path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
